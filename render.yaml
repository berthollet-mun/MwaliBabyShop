services:
  - type: web
    name: mwali-baby-shop-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:server
    # Free Render services do not support pre-deploy commands. The migration
    # and seed scripts are idempotent, so they safely run before every start.
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mwali-baby-shop-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: RESPONSABLE_EMAIL
        sync: false
      - key: RESPONSABLE_INITIAL_PASSWORD
        sync: false

databases:
  - name: mwali-baby-shop-db
    plan: free
    databaseName: mwali_baby_shop
    user: mwali_app
